name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: 🚀 Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@f533c26b74c2778db7edc90c96b63a7d08035765 #v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node

